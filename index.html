<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انجمن ادیتوران | ادیتورهای حرفه‌ای ایران</title>
<meta name="description" content="انجمن ادیتوران؛ معرفی ادیتورهای حرفه‌ای ویدیو، عکس، صدا و موشن‌گرافیک با نمونه‌کار و پروفایل کامل.">
<meta name="theme-color" content="#0f0b08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f97316'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E✦%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jomhuria&family=Lalezar&family=Rakkas&family=Mirza:wght@400;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Vazirmatn:wght@300..900&display=swap">
<style>
:root{
  --bg:#100b07; --s1:#1c130d; --s2:#2a1a10; --pri:#f97316; --pri2:#fb923c; --acc:#fdba74;
  --tx:#fff7ed; --mu:#c4a995; --ln:rgba(251,146,60,.18); --gl:rgba(249,115,22,.35);
  --fd:"Jomhuria",Tahoma,sans-serif; --fb:"Vazirmatn",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.95 var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::selection{background:var(--pri2);color:#fff}
h1,h2,h3,h4{font-family:var(--fd);font-weight:400;line-height:1.25;margin:0}
.wrap{width:92%;max-width:1180px;margin:0 auto}
.hide{display:none!important}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 90% -10%,rgba(249,115,22,.22),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(251,146,60,.14),transparent 60%)}
.notice{background:#9a3412;color:#fff;padding:10px 14px;text-align:center;font-size:14px;line-height:1.8}
.notice.err{background:#7f1d1d}

/* هدر */
.top{position:sticky;top:0;z-index:50;background:rgba(16,11,7,.94);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--fd);font-size:38px;line-height:1}
.brand .mk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.brand small{display:block;font:400 12px/1.4 var(--fb);color:var(--mu)}
.nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nav a{padding:6px 12px;border-radius:10px;color:var(--mu);font-family:var(--fd);font-size:24px;line-height:1.1}
.nav a:hover{color:var(--tx);background:var(--s1)}
.nav a.on{color:var(--acc)}
.nav a.admlink{border:1px solid var(--ln);font-size:20px}
.pbar{position:fixed;top:0;right:0;height:3px;width:100%;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--acc));transform-origin:right;transform:scaleX(0);z-index:60}

/* دکمه */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 24px 8px;border-radius:12px;border:1px solid transparent;background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;font-family:var(--fd);font-size:26px;line-height:1.1;cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.g{background:transparent;border-color:var(--ln);color:var(--tx)}
.btn.g:hover{border-color:var(--acc);color:var(--acc)}
.btn.gold{background:var(--acc);color:#2a1608}
.btn.sm{padding:6px 14px 4px;font-size:21px;border-radius:9px}
.btn.dg{background:transparent;border-color:rgba(248,113,113,.4);color:#fca5a5}
.btn.dg:hover{background:rgba(248,113,113,.1)}
.btn.full{width:100%}

/* بخش‌ها */
section{padding:90px 0 0}
.hero{padding:70px 0 40px;border-bottom:1px solid var(--ln)}
.eyebrow{display:inline-block;margin-bottom:20px;padding:4px 14px;border:1px solid var(--ln);border-radius:8px;color:var(--mu);font-size:14px;background:var(--s1)}
.hero h1{font-size:clamp(84px,13vw,190px);line-height:1.02}
.hero h1 .l2{background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .l3{display:block;font-size:.42em;color:var(--acc);margin-top:6px}
.hero p{max-width:620px;color:var(--mu);font-size:17px;margin:22px 0 28px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:48px;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.stat{padding:24px 18px;background:var(--s1);text-align:center}
.stat+.stat{border-right:1px solid var(--ln)}
.stat b{display:block;font-family:var(--fd);font-weight:400;font-size:64px;line-height:1;color:var(--acc)}
.stat span{color:var(--mu);font-size:14px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:26px;border-bottom:1px solid var(--ln)}
.sh .n{display:block;font-family:var(--fd);color:var(--acc);font-size:26px;line-height:1}
.sh h2{font-size:clamp(56px,7vw,92px);line-height:1}
.sh p{margin:0;max-width:380px;color:var(--mu);font-size:15px}
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.box{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:28px}
.box p{margin:0;color:var(--mu);font-size:15px;line-height:2.1}
.pill{display:grid;gap:12px}
.pill .box{padding:18px 22px}
.pill h4{font-size:32px;margin-bottom:2px}
.pill p{font-size:14px}

/* ردیف‌های مستطیلی ادیتورها */
.tools{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 14px 2px;border:1px solid var(--ln);border-radius:8px;background:var(--s1);color:var(--mu);font-family:var(--fd);font-size:23px;line-height:1.2;cursor:pointer}
.chip:hover{color:var(--tx);border-color:var(--pri2)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.srch{flex:1;max-width:340px;min-width:220px;padding:10px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--s1);outline:none}
.srch:focus{border-color:var(--pri2)}
.erow{display:grid;grid-template-columns:64px 84px minmax(0,1.4fr) minmax(0,1fr) auto 26px;gap:20px;align-items:center;padding:18px 22px;margin-bottom:10px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.erow:hover,.erow:focus-visible{background:var(--s2);border-color:var(--pri);transform:translateX(-4px)}
.erow .ix{font-family:var(--fd);font-size:34px;color:var(--mu);line-height:1}
.erow .av{width:84px;height:84px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:40px;color:#fff;background:var(--c,#f97316)}
.erow .nm b{display:block;font-family:var(--fd);font-weight:400;font-size:40px;line-height:1.1}
.erow .nm i{font-style:normal;color:var(--acc);font-size:14px;display:block}
.erow .nm small{color:var(--mu);font-size:13px;display:block;margin-top:2px;line-height:1.7}
.erow .tg{display:flex;gap:6px;flex-wrap:wrap}
.erow .tg em{font-style:normal;font-size:13px;padding:2px 10px;border-radius:6px;background:rgba(249,115,22,.16);color:#ffedd5}
.erow .go{font-size:24px;color:var(--mu)}
.erow:hover .go{color:var(--acc)}
.empty{padding:40px;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:12px;font-family:var(--fd);font-size:34px}

/* خدمات، مراحل، نظرات، سوالات */
.srow{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1.6fr);gap:22px;align-items:center;padding:22px 24px;margin-bottom:10px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;transition:border-color .2s}
.srow:hover{border-color:var(--acc)}
.srow .k{font-family:var(--fd);font-size:56px;color:var(--pri2);line-height:1}
.srow h3{font-size:40px}
.srow p{margin:0;color:var(--mu);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.step{padding:26px 22px;background:var(--s1)}
.step+.step{border-right:1px solid var(--ln)}
.step .n{font-family:var(--fd);font-size:60px;line-height:1;color:var(--acc)}
.step h3{font-size:34px;margin:6px 0 4px}
.step p{margin:0;color:var(--mu);font-size:14px}
.tg2{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{margin:0;padding:24px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;display:flex;flex-direction:column;gap:12px}
.tcard blockquote{margin:0;color:var(--tx);font-size:15px;line-height:2}
.tcard figcaption b{display:block;font-family:var(--fd);font-weight:400;font-size:30px;line-height:1.1}
.tcard figcaption span{color:var(--mu);font-size:13px}
details.q{background:var(--s1);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;padding:0 22px}
details.q[open]{border-color:var(--pri)}
details.q summary{cursor:pointer;list-style:none;padding:16px 0 12px;font-family:var(--fd);font-size:32px;line-height:1.2;display:flex;justify-content:space-between;align-items:center}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";font-size:36px;color:var(--acc)}
details.q[open] summary::after{content:"−"}
details.q p{margin:0 0 18px;color:var(--mu);font-size:15px;line-height:2}
.cta{padding:56px 36px;text-align:center;border-radius:16px;background:linear-gradient(135deg,#9a3412,#431c0b 60%,#1c130d);border:1px solid rgba(249,115,22,.4)}
.cta h2{font-size:clamp(64px,9vw,118px);line-height:1}
.cta p{color:#ffedd5;max-width:560px;margin:8px auto 24px}
.cta .acts{justify-content:center}
.cta .info{margin-top:22px;color:#fed7aa;font-size:14px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
footer{margin-top:100px;border-top:1px solid var(--ln);background:var(--s1);padding:44px 0 26px}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
.fg h4{font-size:36px;margin-bottom:8px}
.fg p,.fg a{display:block;margin:0 0 6px;color:var(--mu);font-size:14px}
.fg a:hover{color:var(--acc)}
.copy{margin-top:30px;padding-top:16px;border-top:1px solid var(--ln);color:var(--mu);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* پروفایل ادیتور */
.back{display:inline-block;margin-top:28px;color:var(--mu);font-size:15px}
.back:hover{color:var(--acc)}
.ph{display:grid;grid-template-columns:200px minmax(0,1fr);margin-top:16px;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--s1)}
.ph .big{display:grid;place-items:center;background:var(--c,#f97316);font-family:var(--fd);font-size:120px;color:#fff;line-height:1;min-height:200px}
.ph .inf{padding:26px 30px}
.ph h1{font-size:clamp(70px,9vw,120px);line-height:1}
.ph .role{color:var(--acc);font-size:24px;margin:4px 0 8px;font-family:var(--fd)}
.ph .short{color:var(--mu);margin:0}
.blk{margin-top:12px;padding:26px 30px;background:var(--s1);border:1px solid var(--ln);border-radius:14px}
.blk h3{font-size:42px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.blk p{margin:0;color:var(--mu);line-height:2.1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.kv span:first-child{color:var(--mu)}
.kv span:last-child{direction:ltr;text-align:left;word-break:break-all}
.bar{margin-bottom:14px}
.bar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .h span:last-child{color:var(--acc)}
.bar .t{height:6px;background:var(--s2);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width 1s ease}
.pf a,.pf span{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;background:var(--s2)}
.pf a:hover{border-color:var(--acc)}
.pf b{font-family:var(--fd);font-weight:400;font-size:28px}
.pf small{color:var(--mu);font-size:13px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pn a{padding:18px 22px;background:var(--s1);border:1px solid var(--ln);border-radius:12px}
.pn a:hover{border-color:var(--pri2)}
.pn small{display:block;color:var(--mu);font-size:13px}
.pn b{font-family:var(--fd);font-weight:400;font-size:32px;line-height:1.2}
.pn a:last-child{text-align:left}

/* ورود و پنل‌ها */
.adm{padding:40px 0 120px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:24px;margin-bottom:16px}
.card h3{font-size:44px;margin-bottom:12px}
.login{max-width:440px;margin:80px auto}
.login h2{font-size:96px;margin:10px 0 18px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field>label{font-size:13px;color:var(--mu)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pri2)}
.field input[type=color]{width:90px;height:44px;padding:3px;cursor:pointer}
.field input[type=checkbox]{width:18px;height:18px}
.field textarea{min-height:76px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 12px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grp{border:1px solid var(--ln);border-radius:12px;padding:16px 16px 4px;margin:0 0 14px;min-width:0}
.grp>legend{padding:0 8px;font-family:var(--fd);font-size:30px;color:var(--acc)}
.arr{margin-bottom:14px}
.arr-h{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:14px;margin-bottom:6px}
.arr-h strong{font-family:var(--fd);font-weight:400;font-size:30px;color:var(--tx)}
.item{border:1px dashed var(--ln);border-radius:10px;padding:12px 12px 2px;margin-bottom:8px}
.item .btn{margin:2px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.arow{display:grid;grid-template-columns:40px 56px minmax(0,1fr) minmax(0,1fr) auto auto auto auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;background:var(--bg)}
.arow .av{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:26px;color:#fff;background:var(--c)}
.arow input{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--s1);outline:none;min-width:0}
.arow input:focus{border-color:var(--pri2)}
.arow .ix{font-family:var(--fd);font-size:26px;color:var(--mu)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.savebar{position:sticky;bottom:12px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--ln);border-radius:12px;background:rgba(28,19,13,.97)}
.savebar .st{color:var(--mu);font-size:14px}
.savebar .st.dirty{color:var(--acc)}
.err{color:#fca5a5;font-size:14px;min-height:18px;margin-top:6px;line-height:1.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,140px);padding:12px 22px;background:var(--s2);border:1px solid var(--pri2);border-radius:12px;z-index:200;transition:transform .35s ease;font-size:14px;max-width:92%}
.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:150;background:rgba(6,4,16,.8);display:grid;place-items:center;padding:16px}
.mbox{width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px;background:var(--s1);border:1px solid var(--ln);border-radius:14px}
.mbox h3{font-size:50px;margin-bottom:12px}
.welc{position:fixed;inset:0;z-index:140;background:rgba(6,4,16,.7);display:grid;place-items:center;padding:16px}
.welc .mbox{width:min(520px,100%)}
.welc .mbox h3{font-size:60px}
.wed{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:12px;margin-bottom:14px;background:var(--bg)}
.wed .av{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:30px;color:#fff;background:var(--c)}
.wed b{display:block;font-family:var(--fd);font-weight:400;font-size:30px;line-height:1.1}
.wed em{font-style:normal;color:var(--mu);font-size:13px}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.epanel{margin-top:12px;padding:26px 30px;background:var(--s1);border:1px solid var(--pri);border-radius:14px}

@media (max-width:980px){
  .about{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--ln)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .step:nth-child(3){border-right:0}
  .step:nth-child(-n+2){border-bottom:1px solid var(--ln)}
  .tg2{grid-template-columns:1fr}
  .erow{grid-template-columns:50px 64px minmax(0,1fr) auto}
  .erow .tg{display:none}
  .erow .av{width:64px;height:64px;font-size:30px}
  .srow{grid-template-columns:60px minmax(0,1fr)}
  .srow p{grid-column:2}
  .ph{grid-template-columns:1fr}
  .ph .big{min-height:120px;font-size:90px}
  .kv{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
  .arow{grid-template-columns:40px minmax(0,1fr) auto}
  .arow .av,.arow input.r{display:none}
  .arow input.n{grid-column:2}
}
@media (max-width:620px){
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat b{font-size:50px}
  .pn{grid-template-columns:1fr}
  .pn a:last-child{text-align:right}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="pbar" id="pbar"></div>

<header class="top">
  <div class="wrap">
    <a href="#/" class="brand"><span class="mk">✦</span><span><span id="brand"></span><small id="brandSub"></small></span></a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<div id="banner"></div>
<main id="app"></main>

<footer>
  <div class="wrap">
    <div class="fg">
      <div><h4 id="fBrand"></h4><p id="fAbout"></p></div>
      <div><h4 id="fQuickT"></h4><div id="fNav"></div></div>
      <div><h4 id="fContactT"></h4><div id="fContact"></div></div>
    </div>
    <div class="copy"><span id="fCopy"></span><span id="fBadge"></span></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==================================================
   متن‌های رابط (همه قابل ویرایش از پنل مدیریت)

  }
  if (method === "POST" && (url === "/api/login" || url === "/api/editor-login")) {
    const {data, error} = await sb.auth.signInWithPassword({email:String(body.email || "").trim().toLowerCase(), password:String(body.password || "")});
    if (error || !data.user) throw new Error(error?.message || T("wrongPass"));
    const {data:profile, error:profileError} = await sb.from("profiles").select("role").eq("id", data.user.id).maybeSingle();
    if (profileError || !profile || (url === "/api/login" ? profile.role !== "admin" : profile.role !== "editor")) {
      await sb.auth.signOut();
      throw new Error("این حساب اجازه‌ی ورود به این بخش را ندارد.");
    }
    if (profile.role === "editor") {
      const {data:editor, error:editorError} = await sb.from("editors").select("id").eq("id", data.user.id).maybeSingle();
      if (editorError || !editor) { await sb.auth.signOut(); throw new Error("پروفایل ادیتور پیدا نشد."); }
    }
    return {ok:true};
  }
  if (method === "POST" && url === "/api/logout") {
    const {error} = await sb.auth.signOut(); if (error) dbError(error); return {ok:true};
  }
  if (method === "GET" && url === "/api/me") {
    const {data:{user}, error} = await sb.auth.getUser();
    if (error || !user) throw new Error("دسترسی مجاز نیست");
    const {data:profile, error:profileError} = await sb.from("profiles").select("role").eq("id", user.id).maybeSingle();
    if (profileError || !profile) throw new Error("دسترسی مجاز نیست");
    return {ok:true, role:profile.role, id:user.id};
  }
  if (method === "PUT" && url === "/api/config") {
    const {error} = await sb.from("site_config").upsert({id:true, data:body, updated_at:new Date().toISOString()});
    if (error) dbError(error); return {ok:true, config:body};
  }
  if (method === "POST" && url === "/api/config/reset") {
    const config = clone(FALLBACK_CFG);
    const {error} = await sb.from("site_config").upsert({id:true, data:config, updated_at:new Date().toISOString()});
    if (error) dbError(error); return {ok:true, config};
  }
  if (method === "POST" && url === "/api/editors") {
    const email = String(body.loginEmail || "").trim().toLowerCase();
    const password = String(body.password || "");
    if (!email || password.length < 12) throw new Error("برای ساخت ادیتور، ایمیل ورود و رمز حداقل ۱۲ کاراکتری وارد کن.");
    const {data, error} = await sb.functions.invoke("manage-editors", {body:{action:"create", email, password, name:body.name}});
    if (error) throw new Error(error.message || "ساخت حساب ادیتور ناموفق بود.");
    if (data?.error) throw new Error(data.error);
    const id = data?.editor?.id;
    if (!id) throw new Error("حساب ساخته شد اما شناسه‌ی ادیتور دریافت نشد.");
    const row = {...body, id}; delete row.password; delete row.loginEmail;
    const {error:updateError} = await sb.from("editors").update(editorPayload(row)).eq("id", id);
    if (updateError) { await sb.functions.invoke("manage-editors", {body:{action:"delete", editorId:id}}); dbError(updateError); }
    return {ok:true, id};
  }
  const match = url.match(/^\/api\/editors\/(.+)$/);
  if (match) {
    const id = decodeURIComponent(match[1]);
    if (method === "DELETE") {
      const {data, error} = await sb.functions.invoke("manage-editors", {body:{action:"delete", editorId:id}});
      if (error) throw new Error(error.message || "حذف ادیتور ناموفق بود.");
      if (data?.error) throw new Error(data.error); return {ok:true};
    }
    if (method === "PUT") {
      const row = {...body}; delete row.password; delete row.loginEmail;
      const {error} = await sb.from("editors").update(editorPayload(row)).eq("id", id);
      if (error) dbError(error); return {ok:true};
    }
  }
  throw new Error("درخواست نامعتبر است.");
}
function editorPayload(b){
  const out = {};

  [
    "name", "role", "short", "bio",
    "email", "insta", "city", "availability",
    "testimonial", "color"
  ].forEach(k => {
    if (b[k] !== undefined) out[k] = b[k];
  });

  // تبدیل فیلدهای عددی به عدد صحیح
  ["exp", "projects"].forEach(k => {
    if (b[k] !== undefined) {
      const value = String(b[k]).trim();
      out[k] = value === "" ? 0 : Math.max(0, Math.floor(Number(value) || 0));
    }
  });

  if (b.skills !== undefined) {
    out.skills = Array.isArray(b.skills)
      ? b.skills
      : String(b.skills || "").split(",").map(x => x.trim()).filter(Boolean);
  }

  if (b.portfolio !== undefined) {
    out.portfolio = portfolioToDb(b.portfolio);
  }

  return out;
}

        <a class="btn sm g" href="#/editor/${esc(e.id)}">${esc(T("showBtn"))}</a>
        <button class="btn sm dg" data-act="del" data-id="${esc(e.id)}">${esc(T("deleteBtn"))}</button>
      </div>`).join("") || `<div class="empty">${esc(T("noEditorsYet"))}</div>`}</div>
    </div>`;
  } else if (name === "content") {
    if (bar) bar.classList.remove("hide");
    panel.innerHTML = ""; build(DRAFT, panel, "", ["colors", "fonts", "effects"]);
  } else {
    if (bar) bar.classList.remove("hide");
    panel.innerHTML = ""; build({fonts: DRAFT.fonts}, panel, ""); build({colors: DRAFT.colors}, panel, ""); build({effects: DRAFT.effects}, panel, "");
  }
  markState();
}
function markDirty(){ DIRTY = true; markState(); }
function markState(){
  const s = $("#dstate"); if (!s) return;
  s.textContent = DIRTY ? T("dirtyText") : T("savedText");
  s.classList.toggle("dirty", DIRTY);
}
function blank(sample){
  const o = {};
  Object.keys(sample || {}).forEach(k => {
    const v = sample[k];
    o[k] = typeof v === "boolean" ? false : typeof v === "number" ? 0 : Array.isArray(v) ? [] : "";
  });
  return o;
}
/* سازنده‌ی فرم از روی تنظیمات: هر چیزی در تنظیمات باشد اینجا قابل تغییر است */
function build(obj, host, group, skip){
  Object.keys(obj).forEach(k => {
    if (!group && skip && skip.includes(k)) return;
    const v = obj[k], gk = group ? group + "." + k : k;
    if (Array.isArray(v)) {
      const wrap = el("div", "arr");
      wrap.innerHTML = `<div class="arr-h"><strong>${esc(L(k))}</strong><span>${fa(v.length)} ${esc(T("itemWord"))}</span></div>`;
      v.forEach((item, i) => {
        const box = el("div", "item"); build(item, box, "");
        const rm = el("button", "btn sm dg"); rm.textContent = T("removeItemBtn");
        rm.onclick = () => { v.splice(i, 1); markDirty(); setTab(activeTab()); };
        box.appendChild(rm); wrap.appendChild(box);
      });
      const add = el("button", "btn sm g"); add.textContent = T("addItemBtn");
      add.onclick = () => { v.push(blank(v[0] || {title: "", text: ""})); markDirty(); setTab(activeTab()); };
      wrap.appendChild(add); host.appendChild(wrap);
    } else if (v && typeof v === "object") {
      const g = el("fieldset", "grp"); const lg = el("legend"); lg.textContent = L(k); g.appendChild(lg);
      build(v, g, gk); host.appendChild(g);
    } else if (typeof v === "boolean") {
      const lab = el("label", "check"); const cb = el("input"); cb.type = "checkbox"; cb.checked = v;
      cb.onchange = () => { obj[k] = cb.checked; markDirty(); };
      lab.appendChild(cb); lab.append(" " + L(k)); host.appendChild(lab);
    } else {
      const w = el("div", "field"); const lb = el("label"); lb.textContent = L(k); w.appendChild(lb);
      let inp;
      if (gk.startsWith("colors.")) {
        inp = el("input"); inp.type = "color"; inp.value = v;
        inp.oninput = () => { obj[k] = inp.value; markDirty(); };
      } else if (gk === "fonts.display" || gk === "fonts.body") {
        inp = el("select");
        FONTS.forEach(f => { const o = el("option"); o.value = f; o.textContent = f; o.selected = f === v; inp.appendChild(o); });
        inp.onchange = () => { obj[k] = inp.value; markDirty(); };
      } else if (LONG.includes(k) || String(v).length > 70) {
        inp = el("textarea"); inp.value = v;
        inp.oninput = () => { obj[k] = inp.value; markDirty(); };
      } else {
        inp = el("input"); inp.value = v;
        if (typeof v === "number") { inp.type = "number"; inp.oninput = () => { obj[k] = Number(inp.value) || 0; markDirty(); }; }
        else inp.oninput = () => { obj[k] = inp.value; markDirty(); };
      }
      w.appendChild(inp); host.appendChild(w);
    }
  });
}

/* فرم ادیتور (افزودن و ویرایش کامل، با رمز پنل ادیتور) */
function openEditor(id){
  const e = id ? EDS.find(x => x.id === id) : null;
  if (id && !e) { toast(T("notFoundTitle")); return; }
  FCOLOR = e ? e.color : COLORS[EDS.length % COLORS.length];
  const v = x => esc(x ?? "");
  $("#layer").innerHTML = `<div class="modal" id="mdl"><div class="mbox">
    <h3>${esc(e ? T("modalEditTitle") : T("modalNewTitle"))}</h3>
    <div class="grid2">
      <div class="field"><label>${esc(T("fName"))}</label><input id="f_name" value="${v(e && e.name)}"></div>
      <div class="field"><label>${esc(T("fRole"))}</label><input id="f_role" value="${v(e && e.role)}"></div>
      ${!e ? `<div class="field"><label>ایمیل ورود ادیتور</label><input id="f_login_email" type="email" autocomplete="off" required></div>` : ""}
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fShort"))}</label><textarea id="f_short">${v(e && e.short)}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fBio"))}</label><textarea id="f_bio">${v(e && e.bio)}</textarea></div>
      <div class="field"><label>${esc(T("fExp"))}</label><input type="number" id="f_exp" value="${v(e && e.exp)}"></div>
      <div class="field"><label>${esc(T("fProjects"))}</label><input type="number" id="f_projects" value="${v(e && e.projects)}"></div>
      <div class="field"><label>${esc(T("emailLabel"))}</label><input id="f_email" value="${v(e && e.email)}"></div>
      <div class="field"><label>${esc(T("instaLabel"))}</label><input id="f_insta" value="${v(e && e.insta)}"></div>
      <div class="field"><label>${esc(T("fCity"))}</label><input id="f_city" value="${v(e && e.city)}"></div>
      <div class="field"><label>${esc(T("fAvail"))}</label><input id="f_avail" value="${v(e && e.availability)}"></div>
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fSkills"))}</label><input id="f_skills" value="${v(e ? (e.skills || []).join(", ") : "")}"></div>
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fTesti"))}</label><textarea id="f_testi">${v(e && e.testimonial)}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fPortfolio"))}</label><textarea id="f_pf">${v(e ? (e.portfolio || []).map(p => p.title + " | " + (p.link || "")).join("\n") : "")}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fPass"))}</label><input id="f_pass" type="password" autocomplete="new-password" placeholder="${e ? "تغییر رمز از این فرم فعلاً پشتیبانی نمی‌شود" : "حداقل ۱۲ کاراکتر"}" ${e ? "disabled" : "required"}></div>
      <div class="field" style="grid-column:1/-1"><label>${esc(T("fColor"))}</label><div class="sw" id="sw">${COLORS.map(c => `<button type="button" data-sw="${c}" style="background:${c}" class="${c === FCOLOR ? "on" : ""}" aria-label="${c}"></button>`).join("")}</div></div>
    </div>
    <div class="err" id="ferr"></div>
    <div class="mact"><button class="btn" data-act="saveEd" data-id="${v(id || "")}">${esc(T("saveBtnModal"))}</button><button class="btn g" data-act="closeModal">${esc(T("cancelBtn"))}</button></div>
  </div></div>`;
}
function closeModal(){ $("#layer").innerHTML = ""; }

/* ==================================================
   رویدادها (تفویض‌شده)
   ================================================== */
document.addEventListener("click", ev => {
  const t = ev.target;
  const sw = t.closest("[data-sw]");
  if (sw) { FCOLOR = sw.dataset.sw; $$("#sw [data-sw]").forEach(b => b.classList.toggle("on", b === sw)); return; }
  const adm = t.closest("[data-admin-edit]");
  if (adm) { ev.stopPropagation(); location.hash = "#/admin/edit/" + encodeURIComponent(adm.dataset.adminEdit); return; }
  const role = t.closest("[data-role]");
  if (role) { FILTER.role = role.dataset.role; $$("#chips [data-role]").forEach(b => b.classList.toggle("on", b === role)); renderList(); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { setTab(tab.dataset.tab); return; }
  if (t.id === "mdl") return closeModal();
  const act = t.closest("[data-act]");
  if (act) { ev.preventDefault(); return runAction(act.dataset.act, act); }
  const go = t.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; return; }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeModal();
  if (ev.key === "Enter" && ev.target.id === "pw") runAction("login");
  if (ev.key === "Enter" && ev.target.id === "edpass") runAction("editorLogin", document.querySelector('[data-act="editorLogin"]'));
  if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("erow")) location.hash = ev.target.dataset.go;
});
document.addEventListener("input", ev => {
  if (ev.target.id === "q") { FILTER.q = ev.target.value; renderList(); }
});

async function runAction(name, btn){
  try {
    if (name === "login") {
      await api("POST", "/api/login", {email: $("#adminemail").value, password: $("#pw").value});
      ROLE = "admin"; MY_ID = null; renderNav(); renderAdmin(); return;
    }
    if (name === "logout") {
      await api("POST", "/api/logout").catch(() => {});
      ROLE = null; MY_ID = null; renderNav(); location.hash = "#/"; toast(T("toastLoggedOut")); return;
    }
    if (name === "editorLogin") {
      const id = btn.dataset.id || (btn.dataset && btn.dataset.id);
      await api("POST", "/api/editor-login", {email: $("#edemail").value, password: $("#edpass").value});
      await checkSession(); renderNav(); renderEditor(id); return;
    }
    if (name === "editorLogout") {
      await api("POST", "/api/logout").catch(() => {});
      ROLE = null; MY_ID = null; renderNav(); renderEditor(location.hash.replace("#/editor/", "")); return;
    }
    if (name === "saveOwn") {
      const id = btn.dataset.id;
      await api("PUT", "/api/editors/" + encodeURIComponent(id), {
        role: $("#p_role").value, city: $("#p_city").value, short: $("#p_short").value, bio: $("#p_bio").value,
        availability: $("#p_avail").value, email: $("#p_email").value, insta: $("#p_insta").value,
        projects: $("#p_projects").value, skills: $("#p_skills").value, portfolio: $("#p_pf").value
      });
      await load(); renderEditor(id); toast(T("editorSaved")); return;
    }
    if (name === "savecfg") {
      const r = await api("PUT", "/api/config", DRAFT);
      CFG = r.config; CFG.ui = Object.assign({}, UI_DEFAULT, CFG.ui || {});
      DRAFT = clone(CFG); DIRTY = false;
      applyTheme(); markState(); toast(T("toastSaved")); return;
    }
    if (name === "reset") {
      if (!confirm(T("resetConfirm"))) return;
      const r = await api("POST", "/api/config/reset");
      CFG = r.config; CFG.ui = Object.assign({}, UI_DEFAULT, CFG.ui || {});
      DRAFT = clone(CFG); DIRTY = false;
      applyTheme(); setTab(activeTab()); toast(T("toastReset")); return;
    }
    if (name === "saveRow") {
      const row = btn.closest(".arow");
      await api("PUT", "/api/editors/" + encodeURIComponent(btn.dataset.id), {
        name: row.querySelector('[data-f="name"]').value, role: row.querySelector('[data-f="role"]').value
      });
      await load(); renderNav(); setTab("editors"); toast(T("toastRowSaved")); return;
    }
    if (name === "full") { openEditor(btn.dataset.id); return; }
    if (name === "addEd") { openEditor(null); return; }
    if (name === "closeModal") { closeModal(); return; }
    if (name === "del") {
      const e = EDS.find(x => x.id === btn.dataset.id);
      if (!e || !confirm("«" + e.name + "» " + T("deleteConfirm"))) return;
      await api("DELETE", "/api/editors/" + encodeURIComponent(e.id));
      await load(); setTab("editors"); toast(T("toastDeleted")); return;
    }
    if (name === "saveEd") {
      const id = btn.dataset.id;
      const body = {
        name: $("#f_name").value, role: $("#f_role").value, short: $("#f_short").value, bio: $("#f_bio").value,
        exp: $("#f_exp").value, projects: $("#f_projects").value, email: $("#f_email").value, insta: $("#f_insta").value,
        city: $("#f_city").value, availability: $("#f_avail").value, skills: $("#f_skills").value,
        testimonial: $("#f_testi").value, portfolio: $("#f_pf").value, color: FCOLOR, password: $("#f_pass").value, loginEmail: $("#f_login_email")?.value || ""
      };
      if (!body.name.trim()) { $("#ferr").textContent = T("nameRequired"); return; }
      if (id) await api("PUT", "/api/editors/" + encodeURIComponent(id), body);
      else await api("POST", "/api/editors", body);
      closeModal(); await load(); renderNav();
      if (VIEW === "admin") setTab("editors");
      else if (VIEW === "editor") renderEditor(id || location.hash.replace("#/editor/", ""));
      toast(id ? T("toastEdSaved") : T("toastEdAdded"));
      return;
    }
  } catch (err) {
    const target = $("#lerr") || $("#ferr") || $("#eerr") || $("#perr");
    if (target) target.textContent = err.message; else toast(err.message);
  }
}

/* ==================================================
   مسیریابی
   ================================================== */
async function route(){
  const h = location.hash || "#/";
  if (h.startsWith("#/admin")) {
    if (ROLE !== "admin") await checkSession();
    if (ROLE !== "admin") { renderLogin(); return; }
    if (VIEW !== "admin") renderAdmin();
    const m = h.match(/^#\/admin\/edit\/(.+)$/);
    if (m) openEditor(decodeURIComponent(m[1]));
    return;
  }
  if (h.startsWith("#/editor/")) { renderEditor(decodeURIComponent(h.slice(9))); return; }
  if (VIEW !== "home") renderHome();
  const m = h.match(/#([a-z]+)$/);
  requestAnimationFrame(() => {
    const target = m && document.getElementById(m[1]);
    if (target) target.scrollIntoView({behavior: "smooth", block: "start"});
    else if (!m) window.scrollTo({top: 0, behavior: "smooth"});
  });
}
addEventListener("hashchange", route);

let raf = false;
addEventListener("scroll", () => {
  if (raf) return; raf = true;
  requestAnimationFrame(() => {
    const d = document.documentElement, max = d.scrollHeight - d.clientHeight || 1;
    $("#pbar").style.transform = `scaleX(${d.scrollTop / max})`;
    if (VIEW === "home") {
      let cur = "";
      SECS.forEach(k => { const s = document.getElementById(k); if (s && s.getBoundingClientRect().top < innerHeight * .35) cur = k; });
      $$("#nav [data-sec]").forEach(a => a.classList.toggle("on", a.dataset.sec === cur));
    }
    raf = false;
  });
}, {passive: true});

/* ==================================================
   شروع
   ================================================== */
(async function init(){
  try { await load(); }
  catch (e) {
    OFFLINE = true;
    CFG = clone(FALLBACK_CFG); EDS = [];
    CFG.ui = Object.assign({}, UI_DEFAULT, CFG.ui || {});
  }
  await checkSession();
  applyTheme();
  await route();
  if (!OFFLINE && CFG.popup && CFG.popup.show && !location.hash.startsWith("#/admin")) {
    try { if (sessionStorage.getItem("ea_welcome")) return; } catch (e) {}
    setTimeout(showWelcome, Math.max(0, +CFG.popup.delaySec || 0) * 1000);
  }
})();

function showWelcome(){
  const p = CFG.popup, ed = EDS.length ? EDS[Math.floor(Math.random() * EDS.length)] : null;
  const layer = $("#layer");
  if (layer.innerHTML) return;
  layer.innerHTML = `<div class="welc" id="wel"><div class="mbox">
    <h3>${esc(p.title)}</h3><p style="color:var(--mu)">${esc(p.text)}</p>
    ${ed ? `<a class="wed" href="#/editor/${esc(ed.id)}" style="--c:${esc(ed.color)}" data-close="1"><span class="av">${esc(ini(ed.name))}</span><span><small style="color:var(--acc)">${esc(T("welcomeBadge"))}</small><b>${esc(ed.name)}</b><em>${esc(ed.role)}</em></span></a>` : ""}
    <div class="mact"><a class="btn" href="#/#editors" data-close="1">${esc(p.btn)}</a><button class="btn g" data-close="1">${esc(T("cancelBtn"))}</button></div>
  </div></div>`;
  const w = $("#wel");
  w.addEventListener("click", ev => {
    if (ev.target === w || ev.target.closest("[data-close]")) {
      try { sessionStorage.setItem("ea_welcome", "1"); } catch (e) {}
      layer.innerHTML = "";
    }
  });
}
</script>
